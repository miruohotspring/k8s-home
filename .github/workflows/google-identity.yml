name: Google Identity Terraform

on:
  pull_request:
    paths:
      - ".github/workflows/google-identity.yml"
      - "infra/terraform/google-identity/**"
      - "infra/terraform/github-actions/google-identity-backend.tf"
      - "scripts/test-google-identity-contract.py"
  workflow_dispatch:
    inputs:
      operation:
        description: "Run a non-mutating plan or apply the same saved plan after delete/replace rejection."
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: google-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pull request validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform/google-identity infra/terraform/github-actions
      - name: Terraform backend-free validation
        working-directory: infra/terraform/google-identity
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Terraform and IAM contract tests
        run: python3 scripts/test-google-identity-contract.py
      - name: Lint workflow syntax
        uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f # v1.7.11
        with:
          args: -color -oneline .github/workflows/google-identity.yml
      - name: Scan workflow security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          persona: pedantic
          advanced-security: false
          annotations: true

  manage:
    name: Manual main plan or apply
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Assume state role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.GOOGLE_IDENTITY_STATE_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: google-identity-terraform
          mask-aws-account-id: true
      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GOOGLE_IDENTITY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Plan and reject destructive changes
        working-directory: infra/terraform/google-identity
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_IN_AUTOMATION: "true"
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
          jq -e '[.resource_changes[]? | select((.change.actions | index("delete")) or (.change.actions | index("replace")))] | length == 0' tfplan.json >/dev/null
      - name: Reject stale main revision before apply
        if: inputs.operation == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Apply saved plan
        if: inputs.operation == 'apply'
        working-directory: infra/terraform/google-identity
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_IN_AUTOMATION: "true"
        run: terraform apply -input=false -auto-approve tfplan
