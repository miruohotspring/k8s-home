---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-mirror
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-mirror-source
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-secret"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-mirror-source
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-mirror-source
subjects:
  - kind: ServiceAccount
    name: ecr-secret-mirror
    namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-mirror-target
  namespace: m3usick-dev
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-mirror-target
  namespace: m3usick-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-mirror-target
subjects:
  - kind: ServiceAccount
    name: ecr-secret-mirror
    namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-mirror-target
  namespace: m3usick-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-mirror-target
  namespace: m3usick-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-mirror-target
subjects:
  - kind: ServiceAccount
    name: ecr-secret-mirror
    namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-mirror-target
  namespace: cloud-drive-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-mirror-target
  namespace: cloud-drive-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-mirror-target
subjects:
  - kind: ServiceAccount
    name: ecr-secret-mirror
    namespace: default

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-mirror
  namespace: default
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ecr-secret-mirror
        spec:
          serviceAccountName: ecr-secret-mirror
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import json
                  import os
                  import ssl
                  import urllib.error
                  import urllib.request

                  SOURCE_NAMESPACE = "default"
                  TARGET_NAMESPACES = ("m3usick-dev", "m3usick-prod", "cloud-drive-prod")
                  SECRET_NAME = "ecr-secret"
                  API = "https://kubernetes.default.svc"
                  TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                  CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

                  token = open(TOKEN_PATH, encoding="utf-8").read().strip()
                  context = ssl.create_default_context(cafile=CA_PATH)
                  headers = {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  }

                  def request(method, path, payload=None):
                      data = None if payload is None else json.dumps(payload).encode()
                      req_headers = dict(headers)
                      if data is not None:
                          req_headers["Content-Type"] = "application/json"
                      req = urllib.request.Request(
                          API + path,
                          data=data,
                          headers=req_headers,
                          method=method,
                      )
                      with urllib.request.urlopen(req, context=context, timeout=30) as response:
                          return json.load(response)

                  source = request(
                      "GET",
                      f"/api/v1/namespaces/{SOURCE_NAMESPACE}/secrets/{SECRET_NAME}",
                  )
                  dockerconfig = source["data"][".dockerconfigjson"]

                  for namespace in TARGET_NAMESPACES:
                      collection = f"/api/v1/namespaces/{namespace}/secrets"
                      item = f"{collection}/{SECRET_NAME}"
                      desired = {
                          "apiVersion": "v1",
                          "kind": "Secret",
                          "metadata": {
                              "name": SECRET_NAME,
                              "namespace": namespace,
                              "labels": {
                                  "app.kubernetes.io/managed-by": "ecr-secret-mirror",
                              },
                              "annotations": {
                                  "ecr-secret-mirror/source-resource-version": source["metadata"]["resourceVersion"],
                              },
                          },
                          "type": "kubernetes.io/dockerconfigjson",
                          "data": {".dockerconfigjson": dockerconfig},
                      }
                      try:
                          current = request("GET", item)
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                          request("POST", collection, desired)
                          print(f"created {namespace}/{SECRET_NAME}")
                      else:
                          desired["metadata"]["resourceVersion"] = current["metadata"]["resourceVersion"]
                          request("PUT", item, desired)
                          print(f"updated {namespace}/{SECRET_NAME}")
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
