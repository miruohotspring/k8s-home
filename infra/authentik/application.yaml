apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.1
      helm:
        valueFiles:
          - $values/infra/authentik/values.yaml
    - repoURL: git@github.com:miruohotspring/k8s-home.git
      targetRevision: main
      ref: values
    - repoURL: git@github.com:miruohotspring/k8s-home.git
      targetRevision: main
      path: infra/authentik/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
