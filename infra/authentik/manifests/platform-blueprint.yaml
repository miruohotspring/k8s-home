apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  platform.yaml: |
    version: 1
    metadata:
      name: k8s-home platform authentication
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Password change flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - TOTP MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Static MFA setup flow
          required: true

      - model: authentik_core.group
        identifiers:
          name: platform-admins

      - model: authentik_flows.flow
        id: platform-authentication-flow
        identifiers:
          slug: platform-authentication-flow
        attrs:
          designation: authentication
          name: k8s-home password and TOTP authentication
          title: Sign in to k8s-home
          authentication: none

      - model: authentik_stages_identification.identificationstage
        id: platform-identification
        identifiers:
          name: platform-email-identification
        attrs:
          user_fields:
            - email

      - model: authentik_stages_password.passwordstage
        id: platform-password
        identifiers:
          name: platform-password
        attrs:
          backends:
            - authentik.core.auth.InbuiltBackend
          configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: platform-totp-validation
        identifiers:
          name: platform-required-totp
        attrs:
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
          # First-time configuration injects only TOTP, so every account must
          # enroll TOTP. Static single-use codes are accepted only after the
          # user creates them separately as recovery material.
          device_classes: [totp, static]
          last_auth_threshold: seconds=0

      - model: authentik_stages_user_login.userloginstage
        id: platform-login
        identifiers:
          name: platform-12-hour-login
        attrs:
          session_duration: hours=12
          remember_me_offset: seconds=0
          remember_device: seconds=0
          network_binding: no_binding
          geoip_binding: no_binding

      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 10
          stage: !KeyOf platform-identification
          target: !KeyOf platform-authentication-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 20
          stage: !KeyOf platform-password
          target: !KeyOf platform-authentication-flow
        attrs:
          re_evaluate_policies: true
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 30
          stage: !KeyOf platform-totp-validation
          target: !KeyOf platform-authentication-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 100
          stage: !KeyOf platform-login
          target: !KeyOf platform-authentication-flow

      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          flow_authentication: !KeyOf platform-authentication-flow

      - model: authentik_providers_oauth2.scopemapping
        id: platform-groups-scope
        identifiers:
          name: k8s-home groups scope
        attrs:
          scope_name: groups
          description: k8s-home group memberships
          expression: |
            return {"groups": [group.name for group in request.user.groups.all()]}

      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: Argo CD
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd
          client_secret: !Env [AUTHENTIK_ARGOCD_CLIENT_SECRET, ""]
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: hours=12
          refresh_token_validity: hours=12
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.miruohotspring.net/auth/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argocd.miruohotspring.net
          policy_engine_mode: any

      - model: authentik_providers_oauth2.oauth2provider
        id: concourse-provider
        identifiers:
          name: Concourse
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: concourse
          client_secret: !Env [AUTHENTIK_CONCOURSE_CLIENT_SECRET, ""]
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: hours=12
          refresh_token_validity: hours=12
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://concourse.miruohotspring.net/sky/issuer/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: concourse
        attrs:
          name: Concourse
          provider: !KeyOf concourse-provider
          meta_launch_url: https://concourse.miruohotspring.net
          policy_engine_mode: any
