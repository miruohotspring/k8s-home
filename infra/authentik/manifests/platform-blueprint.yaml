apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  platform.yaml: |
    version: 1
    metadata:
      name: k8s-home platform authentication
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Password change flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - TOTP MFA setup flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Static MFA setup flow
          required: true

      - model: authentik_core.group
        identifiers:
          name: platform-admins

      - model: authentik_core.group
        id: cloud-drive-users
        identifiers:
          name: cloud-drive-users
        attrs:
          users:
            - !Find [authentik_core.user, [username, miruohotspring]]

      # Administrators create short-lived, single-use Invitation objects in the
      # authentik Admin interface. Invitation tokens are deliberately not
      # checked into Git. Enrollment creates an internal user but does not log
      # them in, so the first application login must pass the required TOTP
      # stage in platform-authentication-flow below.
      - model: authentik_flows.flow
        id: platform-invitation-enrollment-flow
        identifiers:
          slug: platform-invitation-enrollment
        attrs:
          designation: enrollment
          name: k8s-home invitation enrollment
          title: Complete your k8s-home enrollment
          authentication: require_unauthenticated

      - model: authentik_stages_invitation.invitationstage
        id: platform-invitation-stage
        identifiers:
          name: platform-invitation-required
        attrs:
          continue_flow_without_invitation: false

      - model: authentik_stages_prompt.prompt
        id: platform-invitation-field-username
        identifiers:
          name: platform-invitation-field-username
        attrs:
          field_key: username
          label: Email address (username)
          type: username
          required: true
          placeholder: user@example.com
          placeholder_expression: false
          order: 0

      - model: authentik_stages_prompt.prompt
        id: platform-invitation-field-password
        identifiers:
          name: platform-invitation-field-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          placeholder_expression: false
          order: 1

      - model: authentik_stages_prompt.prompt
        id: platform-invitation-field-password-repeat
        identifiers:
          name: platform-invitation-field-password-repeat
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          placeholder_expression: false
          order: 2

      - model: authentik_stages_prompt.prompt
        id: platform-invitation-field-name
        identifiers:
          name: platform-invitation-field-name
        attrs:
          field_key: name
          label: Name
          type: text
          required: true
          placeholder: Name
          placeholder_expression: false
          order: 0

      - model: authentik_stages_prompt.prompt
        id: platform-invitation-field-email
        identifiers:
          name: platform-invitation-field-email
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: user@example.com
          placeholder_expression: false
          order: 1

      - model: authentik_stages_prompt.promptstage
        id: platform-invitation-prompt-credentials
        identifiers:
          name: platform-invitation-prompt-credentials
        attrs:
          fields:
            - !KeyOf platform-invitation-field-username
            - !KeyOf platform-invitation-field-password
            - !KeyOf platform-invitation-field-password-repeat

      - model: authentik_stages_prompt.promptstage
        id: platform-invitation-prompt-details
        identifiers:
          name: platform-invitation-prompt-details
        attrs:
          fields:
            - !KeyOf platform-invitation-field-name
            - !KeyOf platform-invitation-field-email

      - model: authentik_stages_user_write.userwritestage
        id: platform-invitation-user-write
        identifiers:
          name: platform-invitation-user-write
        attrs:
          user_creation_mode: always_create
          user_type: internal
          user_path_template: users/internal

      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 5
          stage: !KeyOf platform-invitation-stage
          target: !KeyOf platform-invitation-enrollment-flow
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: true
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 10
          stage: !KeyOf platform-invitation-prompt-credentials
          target: !KeyOf platform-invitation-enrollment-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 15
          stage: !KeyOf platform-invitation-prompt-details
          target: !KeyOf platform-invitation-enrollment-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 20
          stage: !KeyOf platform-invitation-user-write
          target: !KeyOf platform-invitation-enrollment-flow

      - model: authentik_flows.flow
        id: platform-authentication-flow
        identifiers:
          slug: platform-authentication-flow
        attrs:
          designation: authentication
          name: k8s-home password and TOTP authentication
          title: Sign in to k8s-home
          authentication: none

      - model: authentik_stages_identification.identificationstage
        id: platform-identification
        identifiers:
          name: platform-email-identification
        attrs:
          user_fields:
            - email

      - model: authentik_stages_password.passwordstage
        id: platform-password
        identifiers:
          name: platform-password
        attrs:
          backends:
            - authentik.core.auth.InbuiltBackend
          configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: platform-totp-validation
        identifiers:
          name: platform-required-totp
        attrs:
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
          # First-time configuration injects only TOTP, so every account must
          # enroll TOTP. Static single-use codes are accepted only after the
          # user creates them separately as recovery material.
          device_classes: [totp, static]
          last_auth_threshold: seconds=0

      - model: authentik_stages_user_login.userloginstage
        id: platform-login
        identifiers:
          name: platform-12-hour-login
        attrs:
          session_duration: days=365
          remember_me_offset: seconds=0
          remember_device: seconds=0
          network_binding: no_binding
          geoip_binding: no_binding

      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 10
          stage: !KeyOf platform-identification
          target: !KeyOf platform-authentication-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 20
          stage: !KeyOf platform-password
          target: !KeyOf platform-authentication-flow
        attrs:
          re_evaluate_policies: true
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 30
          stage: !KeyOf platform-totp-validation
          target: !KeyOf platform-authentication-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 100
          stage: !KeyOf platform-login
          target: !KeyOf platform-authentication-flow

      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          flow_authentication: !KeyOf platform-authentication-flow

      - model: authentik_providers_oauth2.scopemapping
        id: platform-groups-scope
        identifiers:
          name: k8s-home groups scope
        attrs:
          scope_name: groups
          description: k8s-home group memberships
          expression: |
            return {"groups": [group.name for group in request.user.groups.all()]}

      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: Argo CD
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd
          client_secret: !Env [AUTHENTIK_ARGOCD_CLIENT_SECRET, ""]
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: days=365
          refresh_token_validity: days=365
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.miruohotspring.net/auth/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argocd.miruohotspring.net
          policy_engine_mode: any

      - model: authentik_providers_oauth2.oauth2provider
        id: concourse-provider
        identifiers:
          name: Concourse
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: concourse
          client_secret: !Env [AUTHENTIK_CONCOURSE_CLIENT_SECRET, ""]
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: days=365
          refresh_token_validity: days=365
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://concourse.miruohotspring.net/sky/issuer/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: concourse
        attrs:
          name: Concourse
          provider: !KeyOf concourse-provider
          meta_launch_url: https://concourse.miruohotspring.net
          policy_engine_mode: any

      - model: authentik_providers_oauth2.oauth2provider
        id: cloud-drive-web-provider
        identifiers:
          name: Cloud Drive Web
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: cloud-drive-web
          client_secret: !Env [AUTHENTIK_CLOUD_DRIVE_CLIENT_SECRET, ""]
          issuer_mode: per_provider
          access_code_validity: minutes=1
          access_token_validity: minutes=10
          refresh_token_validity: days=365
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://api-drive.miruohotspring.net/v1/auth/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        id: cloud-drive-web-application
        identifiers:
          slug: cloud-drive-web
        attrs:
          name: Cloud Drive
          provider: !KeyOf cloud-drive-web-provider
          meta_launch_url: https://drive.miruohotspring.net
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cloud-drive-web-application
          group: !KeyOf cloud-drive-users
          order: 0
        attrs:
          target: !KeyOf cloud-drive-web-application
          group: !KeyOf cloud-drive-users
          enabled: true
          order: 0
