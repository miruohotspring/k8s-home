apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql-backups
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-postgresql-backup
  namespace: authentik
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  umask 077
                  dump="/backup/authentik-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --file="$dump" authentik
                  pg_restore --list "$dump" >/dev/null
                  find /backup -type f -name 'authentik-*.dump' -mtime +14 -delete
              env:
                - name: PGHOST
                  value: authentik-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: authentik
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-postgresql
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: authentik-postgresql-backups
