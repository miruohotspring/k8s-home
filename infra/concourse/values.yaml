concourse:
  web:
    externalUrl: https://concourse.miruohotspring.net
    kubernetes:
      enabled: true
    auth:
      duration: 8760h
      mainTeam:
        localUser: admin
        oidc:
          group: platform-admins
      oidc:
        enabled: true
        displayName: Authentik
        issuer: https://auth.miruohotspring.net/application/o/concourse/
        scope: profile,email,groups
        groupsKey: groups
        userNameKey: email
        skipEmailVerifiedValidation: true
    # Retained as a break-glass login until OIDC is verified end to end.
    localAuth:
      enabled: true

worker:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

web:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - concourse.miruohotspring.net

postgresql:
  enabled: true
  image: "postgres"
  imageTag: "17.6"
  version: 17
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  persistence:
    enabled: true
    storageClass: local-path
    resources:
      requests:
        storage: 10Gi

secrets:
  # Managed by SealedSecret resources.
  create: false
