apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: m3usick-apps
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/gammaLaboratory/m3usick-gitops.git
    targetRevision: main
    path: infra/argocd
    directory:
      recurse: true
      include: '**/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
