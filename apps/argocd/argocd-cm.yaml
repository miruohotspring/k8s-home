apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.miruohotspring.net
  # Keep the built-in administrator available until OIDC and RBAC are verified.
  admin.enabled: "true"
  oidc.config: |
    name: Authentik
    issuer: https://auth.miruohotspring.net/application/o/argocd/
    clientID: argocd
    clientSecret: $argocd-authentik-oidc:clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    requestedIDTokenClaims: {"groups": {"essential": true}}
