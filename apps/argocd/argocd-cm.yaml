apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.miruohotspring.net
  # Keep the built-in administrator available until Cloudflare OIDC and RBAC are verified.
  admin.enabled: "true"
  users.session.duration: "720h"
  dex.config: |
    expiry:
      idTokens: 720h
    oauth2:
      skipApprovalScreen: true
    # Hermes uses the same Dex browser session as Argo CD. Dex remains a
    # public PKCE client boundary; Cloudflare Access is still the upstream IdP.
    staticClients:
      - id: hermes-dashboard
        name: Hermes Dashboard
        public: true
        redirectURIs:
          - https://hermes.miruohotspring.net/auth/callback
    connectors:
      - type: oidc
        id: cloudflare
        name: Cloudflare Access
        config:
          issuer: $argocd-cloudflare-oidc:issuer
          clientID: $argocd-cloudflare-oidc:clientID
          clientSecret: $argocd-cloudflare-oidc:clientSecret
          redirectURI: https://argocd.miruohotspring.net/api/dex/callback
          scopes: ["openid", "profile", "email", "offline_access"]
          # OTP identities omit name; use email only as the display name.
          # Leave userIDKey unset so identity remains the signed OIDC sub.
          userNameKey: email
          # Access authenticates the approved email upstream but omits this
          # optional claim. Trust only this pinned Access connector; the app
          # allows only email OTP, the exact email allowlist and independent TOTP.
          # TLS/JWT/issuer/audience/sub verification remain enabled.
          insecureSkipEmailVerified: true
          # Do not force a fresh consent interaction on every offline login.
          promptType: ""
