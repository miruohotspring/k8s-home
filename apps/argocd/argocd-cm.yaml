apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.miruohotspring.net
  # Keep the built-in administrator available until Cloudflare OIDC and RBAC are verified.
  admin.enabled: "true"
  users.session.duration: "720h"
  dex.config: |
    expiry:
      idTokens: 720h
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: oidc
        id: cloudflare
        name: Cloudflare Access
        config:
          issuer: $argocd-cloudflare-oidc:issuer
          clientID: $argocd-cloudflare-oidc:clientID
          clientSecret: $argocd-cloudflare-oidc:clientSecret
          redirectURI: https://argocd.miruohotspring.net/api/dex/callback
          scopes: ["openid", "profile", "email"]
          # OTP identities omit name; use email only as the display name.
          # Leave userIDKey unset so identity remains the signed OIDC sub.
          userNameKey: email
