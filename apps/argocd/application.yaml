apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: git@github.com:miruohotspring/k8s-home.git
    targetRevision: main
    path: apps/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: argocd-rbac-cm
      namespace: argocd
      jsonPointers:
        - /data/policy.cloudflare.csv
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
