apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-rbac-patch
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-rbac-patch
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-rbac-cm"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-rbac-patch
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: argocd-rbac-patch
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-rbac-patch
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-rbac-cloudflare-overlay
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-rbac-cloudflare-overlay
        app.kubernetes.io/part-of: argocd
    spec:
      automountServiceAccountToken: true
      restartPolicy: Never
      serviceAccountName: argocd-rbac-patch
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: patch
          image: registry.k8s.io/kubectl@sha256:1c6309bd167feb49b2bc1605bce05973002872fd0d26a2e76499ed0c903ea3cf
          imagePullPolicy: IfNotPresent
          command: ["kubectl"]
          args:
            - "--namespace=argocd"
            - patch
            - configmap
            - argocd-rbac-cm
            - "--type=merge"
            - "--patch-file=/patch/rbac-patch.json"
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: rbac-patch
              mountPath: /patch
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: rbac-patch
          secret:
            secretName: argocd-cloudflare-oidc
            items:
              - key: rbac-patch.json
                path: rbac-patch.json
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
